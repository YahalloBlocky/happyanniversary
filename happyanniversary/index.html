<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1 Year of loving you</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Dancing+Script:wght@600;700&family=Lato:wght@300;400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style-anniv.css" />
</head>

<body class="index-page">

  <div class="bg-wash"></div>

  <!-- background floating flowers -->
  <div class="bg-flowers" id="bgFlowers">
    <!-- JS will inject these -->
  </div>

  <!-- falling petals -->
  <div class="petals-wrap" id="petals"></div>

  <!-- center stage -->
  <div class="stage" id="stage">

    <p class="label-top">Happy</p>
    <p class="label-anniv">First Anniversary Love!</p>

    <!--
      THE FLOWER BUTTON
      Three-stem bouquet recreated in SVG from your drawing:
      · left stem  → golden-orange daisy (warm petals, golden center)
      · center stem → yellow-green daisy (chartreuse petals)
      · right stem → dusty rose daisy
      Green stems, soft sage leaves, little heart accents at the base
    -->
    <div class="flower-btn-wrap" id="flowerBtnWrap" role="button" tabindex="0" aria-label="Open my letter">

      <svg class="flower-svg-btn" viewBox="0 0 150 190" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

        <!-- ── STEMS ── -->
        <path d="M52 185 C52 185 55 160 60 140 C64 122 62 108 56 92" stroke="#5a9a4a" stroke-width="3.5"
          stroke-linecap="round" fill="none" />
        <path d="M75 185 C75 185 75 158 75 138 C75 118 73 102 73 82" stroke="#4a8a3a" stroke-width="3.5"
          stroke-linecap="round" fill="none" />
        <path d="M98 185 C98 185 94 160 90 140 C86 122 88 108 92 92" stroke="#5a9a4a" stroke-width="3.5"
          stroke-linecap="round" fill="none" />

        <!-- ── LEAVES ── -->
        <!-- left stem leaf -->
        <ellipse cx="48" cy="148" rx="13" ry="6" fill="#6aaa5a" opacity=".85" transform="rotate(-38 48 148)" />
        <!-- right stem leaf -->
        <ellipse cx="102" cy="145" rx="13" ry="6" fill="#6aaa5a" opacity=".85" transform="rotate(38 102 145)" />
        <!-- center stem leaf -->
        <ellipse cx="68" cy="128" rx="11" ry="5" fill="#7aba6a" opacity=".75" transform="rotate(-25 68 128)" />
        <ellipse cx="82" cy="120" rx="10" ry="5" fill="#7aba6a" opacity=".75" transform="rotate(25 82 120)" />

        <!-- ════════════════════
             LEFT FLOWER — golden orange
        ════════════════════ -->
        <!-- petals (12, radiating) -->
        <g transform="translate(56,88)">
          <ellipse cx="0" cy="-18" rx="5.5" ry="13" fill="#c9956a" opacity=".88" transform="rotate(0)" />
          <ellipse cx="0" cy="-18" rx="5.5" ry="13" fill="#c9956a" opacity=".82" transform="rotate(30)" />
          <ellipse cx="0" cy="-18" rx="5.5" ry="13" fill="#d4a070" opacity=".80" transform="rotate(60)" />
          <ellipse cx="0" cy="-18" rx="5.5" ry="13" fill="#c9956a" opacity=".85" transform="rotate(90)" />
          <ellipse cx="0" cy="-18" rx="5.5" ry="13" fill="#bf8858" opacity=".78" transform="rotate(120)" />
          <ellipse cx="0" cy="-18" rx="5.5" ry="13" fill="#c9956a" opacity=".84" transform="rotate(150)" />
          <ellipse cx="0" cy="-18" rx="5.5" ry="13" fill="#d4a070" opacity=".80" transform="rotate(180)" />
          <ellipse cx="0" cy="-18" rx="5.5" ry="13" fill="#c9956a" opacity=".83" transform="rotate(210)" />
          <ellipse cx="0" cy="-18" rx="5.5" ry="13" fill="#bf8858" opacity=".79" transform="rotate(240)" />
          <ellipse cx="0" cy="-18" rx="5.5" ry="13" fill="#c9956a" opacity=".86" transform="rotate(270)" />
          <ellipse cx="0" cy="-18" rx="5.5" ry="13" fill="#d4a070" opacity=".80" transform="rotate(300)" />
          <ellipse cx="0" cy="-18" rx="5.5" ry="13" fill="#c9956a" opacity=".84" transform="rotate(330)" />
          <!-- center -->
          <circle cx="0" cy="0" r="8" fill="#e8c06a" />
          <circle cx="0" cy="0" r="5.5" fill="#d4a848" />
          <circle cx="0" cy="0" r="3" fill="#c09030" />
          <!-- center dot sparkles -->
          <circle cx="-2" cy="-2" r="0.8" fill="#f0d070" opacity=".8" />
          <circle cx="2" cy="-1" r="0.8" fill="#f0d070" opacity=".7" />
          <circle cx="1" cy="2" r="0.6" fill="#f0d070" opacity=".6" />
        </g>

        <!-- ════════════════════
             CENTER FLOWER — yellow-green
        ════════════════════ -->
        <g transform="translate(74,74)">
          <ellipse cx="0" cy="-20" rx="6" ry="14" fill="#b8c86a" opacity=".85" transform="rotate(0)" />
          <ellipse cx="0" cy="-20" rx="6" ry="14" fill="#a8b85a" opacity=".80" transform="rotate(30)" />
          <ellipse cx="0" cy="-20" rx="6" ry="14" fill="#c0d070" opacity=".78" transform="rotate(60)" />
          <ellipse cx="0" cy="-20" rx="6" ry="14" fill="#b8c86a" opacity=".83" transform="rotate(90)" />
          <ellipse cx="0" cy="-20" rx="6" ry="14" fill="#a8b85a" opacity=".79" transform="rotate(120)" />
          <ellipse cx="0" cy="-20" rx="6" ry="14" fill="#b8c86a" opacity=".84" transform="rotate(150)" />
          <ellipse cx="0" cy="-20" rx="6" ry="14" fill="#c0d070" opacity=".78" transform="rotate(180)" />
          <ellipse cx="0" cy="-20" rx="6" ry="14" fill="#b8c86a" opacity=".82" transform="rotate(210)" />
          <ellipse cx="0" cy="-20" rx="6" ry="14" fill="#a8b85a" opacity=".80" transform="rotate(240)" />
          <ellipse cx="0" cy="-20" rx="6" ry="14" fill="#b8c86a" opacity=".85" transform="rotate(270)" />
          <ellipse cx="0" cy="-20" rx="6" ry="14" fill="#c0d070" opacity=".78" transform="rotate(300)" />
          <ellipse cx="0" cy="-20" rx="6" ry="14" fill="#b8c86a" opacity=".82" transform="rotate(330)" />
          <!-- center -->
          <circle cx="0" cy="0" r="9" fill="#d4b060" />
          <circle cx="0" cy="0" r="6.5" fill="#c09848" />
          <circle cx="0" cy="0" r="3.5" fill="#a87830" />
          <circle cx="-2" cy="-2" r="0.9" fill="#f0d880" opacity=".75" />
          <circle cx="2" cy="-1" r="0.9" fill="#f0d880" opacity=".65" />
          <circle cx="0" cy="2" r="0.7" fill="#f0d880" opacity=".55" />
        </g>

        <!-- ════════════════════
             RIGHT FLOWER — dusty rose
        ════════════════════ -->
        <g transform="translate(92,88)">
          <ellipse cx="0" cy="-17" rx="5.5" ry="12" fill="#c08090" opacity=".85" transform="rotate(0)" />
          <ellipse cx="0" cy="-17" rx="5.5" ry="12" fill="#b87080" opacity=".80" transform="rotate(30)" />
          <ellipse cx="0" cy="-17" rx="5.5" ry="12" fill="#cc90a0" opacity=".78" transform="rotate(60)" />
          <ellipse cx="0" cy="-17" rx="5.5" ry="12" fill="#c08090" opacity=".84" transform="rotate(90)" />
          <ellipse cx="0" cy="-17" rx="5.5" ry="12" fill="#b87080" opacity=".79" transform="rotate(120)" />
          <ellipse cx="0" cy="-17" rx="5.5" ry="12" fill="#c08090" opacity=".83" transform="rotate(150)" />
          <ellipse cx="0" cy="-17" rx="5.5" ry="12" fill="#cc90a0" opacity=".78" transform="rotate(180)" />
          <ellipse cx="0" cy="-17" rx="5.5" ry="12" fill="#c08090" opacity=".82" transform="rotate(210)" />
          <ellipse cx="0" cy="-17" rx="5.5" ry="12" fill="#b87080" opacity=".80" transform="rotate(240)" />
          <ellipse cx="0" cy="-17" rx="5.5" ry="12" fill="#c08090" opacity=".85" transform="rotate(270)" />
          <ellipse cx="0" cy="-17" rx="5.5" ry="12" fill="#cc90a0" opacity=".78" transform="rotate(300)" />
          <ellipse cx="0" cy="-17" rx="5.5" ry="12" fill="#c08090" opacity=".83" transform="rotate(330)" />
          <!-- center -->
          <circle cx="0" cy="0" r="7.5" fill="#e0b0a0" />
          <circle cx="0" cy="0" r="5" fill="#c89080" />
          <circle cx="0" cy="0" r="2.5" fill="#a86858" />
          <circle cx="-1.5" cy="-1.5" r="0.8" fill="#f0d0c0" opacity=".7" />
          <circle cx="1.5" cy="-0.5" r="0.8" fill="#f0d0c0" opacity=".6" />
        </g>

        <!-- ── HEART ACCENTS at base ── -->
        <g opacity=".5">
          <path d="M38 178 C38 178 34 174 34 172 A2 2 0 0 1 38 170.5 A2 2 0 0 1 42 172 C42 174 38 178 38 178Z"
            fill="#c08090" />
          <path d="M112 180 C112 180 109 176 109 174 A2 2 0 0 1 112 172.5 A2 2 0 0 1 115 174 C115 176 112 180 112 180Z"
            fill="#c9956a" />
          <path
            d="M75 182 C75 182 72 178.5 72 177 A1.8 1.8 0 0 1 75 175.5 A1.8 1.8 0 0 1 78 177 C78 178.5 75 182 75 182Z"
            fill="#b8c86a" />
        </g>

      </svg>

      <span class="btn-label">Tap nimo yung flower:></span>
    </div>



  </div><!-- /stage -->

  <div class="overlay" id="overlay"></div>

  <script src="main-anniv.js"></script>
  <script>
    // Inject background flowers (small versions of same SVG, varied)
    (function () {
      const wrap = document.getElementById('bgFlowers');
      const colors = [
        { petal: '#c9956a', center: '#d4a848' },
        { petal: '#b8c86a', center: '#c09848' },
        { petal: '#c08090', center: '#c89080' },
        { petal: '#d4a070', center: '#e8c06a' },
        { petal: '#a8b85a', center: '#c09030' },
      ];
      for (let i = 0; i < 12; i++) {
        const c = colors[i % colors.length];
        const div = document.createElement('div');
        div.className = 'bg-fl';
        div.innerHTML = `<svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
          <line x1="30" y1="68" x2="30" y2="34" stroke="#5a9a4a" stroke-width="2.5" stroke-linecap="round"/>
          <ellipse cx="20" cy="52" rx="9" ry="4" fill="#6aaa5a" opacity=".7" transform="rotate(-30 20 52)"/>
          <g transform="translate(30,30)">
            ${[0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330].map(a =>
          `<ellipse cx="0" cy="-13" rx="4" ry="10" fill="${c.petal}" opacity=".8" transform="rotate(${a})"/>`
        ).join('')}
            <circle cx="0" cy="0" r="6" fill="${c.center}"/>
            <circle cx="0" cy="0" r="3.5" fill="${c.center}" opacity=".7"/>
          </g>
        </svg>`;
        wrap.appendChild(div);
      }
    })();
  </script>
</body>

</html>
